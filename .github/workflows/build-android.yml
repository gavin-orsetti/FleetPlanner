name: Build Android APK

on:
  push:
    branches:
      - FleetplannerV2
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: FleetplannerV2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workloads
        run: dotnet workload install android maui-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore NuGet packages (main app only)
        run: dotnet restore FleetPlanner/FleetPlanner.csproj -f net10.0-android

      - name: Build Android APK (Debug)
        run: dotnet build FleetPlanner/FleetPlanner.csproj -f net10.0-android -c Debug --no-restore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetPlanner-debug.apk
          path: '**/*.apk'
          retention-days: 7
          if-no-files-found: error
