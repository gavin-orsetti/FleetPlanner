name: Build Android APK

on:
  push:
    branches:
      - FleetplannerV2
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: FleetplannerV2

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.1

      - name: Restore
        run: dotnet restore FleetPlanner/FleetPlanner.csproj -p:TargetFramework=net9.0-android

      - name: Publish
        run: dotnet publish FleetPlanner/FleetPlanner.csproj -f net9.0-android -c Debug -r android-arm64 --no-restore -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: FleetPlanner-debug.apk
          path: '**/*.apk'
          retention-days: 7
          if-no-files-found: error
